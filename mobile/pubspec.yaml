name: community_attendance
version: 1.0.0+1
publish_to: none
description: Aplicación de código abierto para registro y control de asistencia de jóvenes.

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  mobile_scanner: ^7.0.1
  qr_flutter: ^4.1.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Put your own logos here and reference them from config/app.json.
    - assets/branding/
